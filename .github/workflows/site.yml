# MOD35: the site (site\), built on every change to it and published to GitHub Pages at
# https://alegauss.github.io/modelado/, the base vite.config.ts names. After freewilly's site.yml.
#
# The gate is the build: `npm run build` runs tsc, the client and SSR builds, the social card
# and the prerender, whose replace-or-throw head patch fails on a template that lost an anchor.
# A pull request touching site\ runs it and deploys nothing, so a broken prerender fails the
# check before it is merged; a push to main touching site\, or a run by hand, publishes the bytes
# that build made rather than building twice.
#
# ONE-TIME REPOSITORY SETTING, without which the deploy job fails: Settings > Pages > Build and
# deployment > Source: "GitHub Actions".

name: site

# MOD34: the page reads the latest release and the embedded models manifest at build time, so it
# is built again when either changes. release.yml publishes with GITHUB_TOKEN, whose release event
# starts no other workflow; its completion does.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml", "src/Modelado.Inference/models-manifest.json"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml", "src/Modelado.Inference/models-manifest.json"]
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

# Least privilege by default; the Pages grants live on the job that publishes.
permissions:
  contents: read

# One publish at a time; a pull request's build has nothing to do with another's.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('site-check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (the gate)
    # After a release, only one that succeeded has an installer to link to.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The social card rasterises SVG text with resvg, which needs a font on disk.
      - name: Fonts for the social card
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Keep the built site for the deploy
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: deploy to Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
