<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Modelado's mark, the app icon tools/Modelado.Icon draws (MOD7), on the same 512 grid and in
       Brand.cs's colours: an isometric cube on a blue tile, its faces split into triangles. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B9BE6" />
      <stop offset="1" stop-color="#234F9C" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)" />
  <polygon points="256,80 408.4,168 256,256 103.6,168" fill="#FFFFFF" />
  <polygon points="103.6,168 256,256 256,432 103.6,344" fill="#D6E5F8" />
  <polygon points="256,256 408.4,168 408.4,344 256,432" fill="#A4C1EA" />
  <g stroke="#234F9C" stroke-opacity="0.43" stroke-width="7" stroke-linecap="round">
    <line x1="332.2" y1="124" x2="179.8" y2="212" />
    <line x1="179.8" y1="124" x2="332.2" y2="212" />
    <line x1="256" y1="80" x2="256" y2="256" />
    <line x1="179.8" y1="212" x2="179.8" y2="388" />
    <line x1="103.6" y1="256" x2="256" y2="344" />
    <line x1="103.6" y1="168" x2="256" y2="432" />
    <line x1="332.2" y1="212" x2="332.2" y2="388" />
    <line x1="256" y1="344" x2="408.4" y2="256" />
    <line x1="256" y1="256" x2="408.4" y2="344" />
  </g>
</svg>
