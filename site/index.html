<!doctype html>
<html lang="en" data-tone="cool">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/modelado/favicon.svg" />
    <link rel="apple-touch-icon" href="/modelado/apple-touch-icon.png" />

    <!--
      The theme follows the OS, and a stored choice wins over it. The design system's
      pre-paint script replaces the anchor below, inlined by vite.config.ts.
    -->
    <!--theme-script-->

    <title>Modelado: a photo becomes a 3D model, on your PC</title>
    <meta
      name="description"
      content="Turn a photo into a 3D object or a relief, then clean it up and export it for printing, games or the web, with AI on your own Windows computer. Nothing is uploaded."
    />

    <!--
      scripts/prerender.mjs patches the title, description, canonical and og:url by
      replace-or-throw and inlines the rendered body into the root element. No closing head or
      script token may appear in a comment here.
    -->
  </head>
  <body class="vg-site">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
